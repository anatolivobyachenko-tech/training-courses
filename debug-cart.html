<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>НалагодженняCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Налагодження системи записів</h1>
        
        <div class="card mb-3">
            <div class="card-body">
                <h5>Статус:</h5>
                <p id="status" class="alert alert-info">Завантаження...</p>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <h5>Дані в localStorage:</h5>
                <pre id="storage-data" class="bg-light p-3">Завантаження...</pre>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <h5>Дії:</h5>
                <button class="btn btn-primary" onclick="refreshData()">Оновити</button>
                <button class="btn btn-success" onclick="addTestCart()">Додати тестовий кошик</button>
                <button class="btn btn-danger" onclick="clearStorage()">Очистити localStorage</button>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5>Покроковий тест:</h5>
                <ol>
                    <li><a href="courses.html">Перейди на Курси</a></li>
                    <li>Натисни "Записатися" на декількох курсах</li>
                    <li>Натисни "Оновити" вище, щоб побачити дані</li>
                    <li><a href="cart.html">Перейди на Записи</a></li>
                    <li>Перевір, чи видно товари</li>
                </ol>
            </div>
        </div>
    </div>

    <script>
        function refreshData() {
            const data = localStorage.getItem('cart');
            const status = document.getElementById('status');
            const storageData = document.getElementById('storage-data');
            
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    status.innerHTML = `<strong>✓ Кошик знайдено!</strong> Товарів: ${Object.keys(parsed).length}`;
                    storageData.textContent = JSON.stringify(parsed, null, 2);
                } catch (e) {
                    status.innerHTML = `<strong>✗ Помилка парсування JSON:</strong> ${e.message}`;
                    storageData.textContent = data;
                }
            } else {
                status.innerHTML = '<strong>⚠ Кошик пустий!</strong>';
                storageData.textContent = 'localStorage["cart"] не знайден';
            }
        }

        function clearStorage() {
            if (confirm('Очистити localStorage?')) {
                localStorage.removeItem('cart');
                refreshData();
            }
        }

        function addTestCart() {
            const testCart = {
                1: {
                    id: 1,
                    title: "Тест курс 1",
                    description: "Опис",
                    price: 100,
                    image: "https://via.placeholder.com/100",
                    quantity: 1
                },
                2: {
                    id: 2,
                    title: "Тест курс 2",
                    description: "Опис",
                    price: 200,
                    image: "https://via.placeholder.com/100",
                    quantity: 2
                }
            };
            localStorage.setItem('cart', JSON.stringify(testCart));
            refreshData();
        }

        refreshData();
    </script>
</body>
</html>
