<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Тест курсів</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Тест завантаження курсів</h1>
        
        <h3>Тест 1: Завантаження JSON</h3>
        <div id="test1"></div>
        
        <h3>Тест 2: Генерування посилання</h3>
        <div id="test2"></div>
        
        <h3>Тест 3: URL параметри</h3>
        <p>Нинішній URL: <code id="current-url"></code></p>
        <p>ID з URL: <code id="url-id"></code></p>
        
        <hr>
        
        <h3>Посилання для тестування:</h3>
        <ul id="links-list"></ul>
    </div>

    <script>
        // Тест 1: Завантаження JSON
        async function testJSON() {
            try {
                const response = await fetch('products.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                document.getElementById('test1').innerHTML = `
                    <div class="alert alert-success">
                        ✓ JSON завантажено успішно!<br>
                        Курсів: ${data.length}<br>
                        Перший ID: ${data[0].id}, Title: ${data[0].title}
                    </div>
                `;
                
                // Тест 2: Генерування посилань
                let links = '';
                data.forEach(course => {
                    links += `<li><a href="product.html?id=${course.id}" target="_blank">${course.title} (ID: ${course.id})</a></li>`;
                });
                document.getElementById('test2').innerHTML = `
                    <div class="alert alert-info">
                        ✓ Посилання на курси:
                        <ul>${links}</ul>
                    </div>
                `;
                
                // Тест 3: Перелік всіх посилань
                document.getElementById('links-list').innerHTML = links;
            } catch (error) {
                document.getElementById('test1').innerHTML = `
                    <div class="alert alert-danger">
                        ✗ Помилка: ${error.message}
                    </div>
                `;
            }
        }
        
        // Тест URL параметрів
        document.getElementById('current-url').textContent = window.location.href;
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        document.getElementById('url-id').textContent = id || '(не передано)';
        
        testJSON();
    </script>
</body>
</html>
