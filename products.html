<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог курсів — Доп.Заняття</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-mortarboard"></i> Доп.Заняття
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Головна</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">Курси</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="schedule.html">
                            <i class="bi bi-calendar3"></i> Розклад
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">
                            <i class="bi bi-person-circle"></i> Мій кабінет
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            <i class="bi bi-journal-check"></i> Записи
                            <span class="badge bg-danger" id="cart-count">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Сторінка: Каталог курсів -->
    <section class="py-5">
        <div class="container">
            <h2 class="mb-4">Каталог курсів</h2>

            <div class="row">
                <!-- Сайдбар: фільтри / сортування -->
                <aside class="col-lg-3 mb-4">
                    <div class="card shadow-sm sticky-top" style="top:20px;">
                        <div class="card-body">
                            <h5 class="card-title mb-4">
                                <i class="bi bi-funnel"></i> Фільтри
                            </h5>

                            <div class="mb-4">
                                <label class="form-label fw-bold" for="category-filter">Предмет</label>
                                <select class="form-select" id="category-filter">
                                    <option value="all">Усі предмети</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold" for="search-input">Пошук</label>
                                <input type="text" class="form-control" id="search-input" placeholder="За назвою або викладачем...">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold" for="sort-filter">Сортування</label>
                                <select class="form-select" id="sort-filter">
                                    <option value="default">За популярністю</option>
                                    <option value="price-asc">Ціна: за зростанням</option>
                                    <option value="price-desc">Ціна: за спаданням</option>
                                    <option value="name">За назвою (А-Я)</option>
                                </select>
                            </div>

                            <button id="reset-filters" class="btn btn-outline-secondary w-100">
                                <i class="bi bi-arrow-clockwise"></i> Скинути фільтри
                            </button>
                        </div>
                    </div>
                </aside>

                <!-- Контент: курси -->
                <main class="col-lg-9">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div id="results-info" class="text-muted">Завантаження...</div>
                    </div>

                    <!-- Список курсів -->
                    <div class="row g-4" id="products-list">
                        <!-- Курси будуть додані через JavaScript -->
                    </div>
                </main>
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <div class="row mb-3">
                <div class="col-md-4 mb-2">
                    <h6 class="fw-bold">Про школу</h6>
                    <p class="small text-white-50 mb-0">Онлайн заняття, підготовка до ЗНО та підтримка в навчанні.</p>
                </div>
                <div class="col-md-4 mb-2">
                    <h6 class="fw-bold">Контакти</h6>
                    <p class="small text-white-50 mb-0"><i class="bi bi-telephone"></i> +38 (050) 123-45-67</p>
                    <p class="small text-white-50 mb-0"><i class="bi bi-envelope"></i> hello@dop.zanyattya.ua</p>
                </div>
                <div class="col-md-4">
                    <h6 class="fw-bold">Слідкуйте</h6>
                    <div class="d-flex gap-2 justify-content-center justify-content-md-start">
                        <a href="#" class="btn btn-outline-light btn-sm"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="btn btn-outline-light btn-sm"><i class="bi bi-instagram"></i></a>
                        <a href="#" class="btn btn-outline-light btn-sm"><i class="bi bi-telegram"></i></a>
                    </div>
                </div>
            </div>
            <div class="text-white-50 small">&copy; 2025 Доп.Заняття. Всі права захищені.</div>
        </div>
    </footer>

    <!-- Скріпти -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/cart.js"></script>
    <script src="scripts/products.js"></script>
</body>
</html>
